plugins {
    id 'com.android.application'
}

android {
    namespace 'EY.ONYX.PE'
    compileSdk 34

    defaultConfig {
        applicationId "EY.ONYX.PE"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.8.9-onyx"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly project(':xposed-stub')
}
